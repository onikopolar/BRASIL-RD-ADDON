name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'package.json'  # evita loop quando o bot commita a versao
  workflow_dispatch:     # permite rodar manualmente

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: |
          npm install
          npm run build

      - name: Zip dist
        run: zip -r dist.zip dist/

      - name: Gerar changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "## Commits" > CHANGELOG.md
            git log --oneline >> CHANGELOG.md
          else
            echo "## Mudancas desde $LAST_TAG" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s" >> CHANGELOG.md
          fi
          cat CHANGELOG.md

      - name: Definir versao
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if git rev-parse "v$CURRENT" >/dev/null 2>&1; then
            IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
            NEW="$MAJ.$MIN.$((PAT + 1))"
            echo "Auto-bump: $CURRENT -> $NEW"
            node -e "const p=require('./package.json');p.version='$NEW';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add package.json
            git commit -m "chore: bump to v$NEW"
            git tag "v$NEW"
            git push origin master --tags
          else
            NEW="$CURRENT"
            echo "Versao manual: $NEW"
          fi
          echo "VERSION=$NEW" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.VERSION }}
          name: v${{ steps.bump.outputs.VERSION }}
          body_path: CHANGELOG.md
          files: dist.zip
