name: Release

on:
  push:
    branches: [master]
    paths-ignore: ['package.json']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: npm install && npm run build

      - name: Zip
        run: zip -r dist.zip dist/

      - name: Changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "## Commits" > CHANGELOG.md
            git log --oneline >> CHANGELOG.md
          else
            echo "## Mudancas desde $LAST_TAG" > CHANGELOG.md
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s" >> CHANGELOG.md
          fi

      - name: Bump e tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          CURRENT=$(node -p "require('./package.json').version")
          if git rev-parse "v$CURRENT" >/dev/null 2>&1; then
            IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
            NEW="$MAJ.$MIN.$((PAT + 1))"
          else
            NEW="$CURRENT"
          fi
          echo "VERSION=$NEW" >> $GITHUB_ENV
          git tag "v$NEW"
          git push origin "v$NEW"

      - name: Release
        run: |
          gh release create "v$VERSION" dist.zip \
            --title "v$VERSION" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
