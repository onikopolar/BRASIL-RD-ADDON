name: Release

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar se versão mudou
        id: check
        run: |
          # Pega a versão do package.json
          CURRENT=$(node -p "require('./package.json').version")
          echo "Versão no package.json: $CURRENT"

          # Pega a maior tag existente
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -1 | sed 's/^v//')
          echo "Maior tag existente: v${LATEST_TAG:-nenhuma}"

          # Se não tem tag, primeira release
          if [ -z "$LATEST_TAG" ]; then
            echo "Primeira release — prosseguindo"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Compara versões: só prossegue se package.json for maior que a maior tag
          MAIOR=$(printf "%s\n%s" "$CURRENT" "$LATEST_TAG" | sort -V | tail -1)

          if [ "$MAIOR" = "$CURRENT" ] && [ "$CURRENT" != "$LATEST_TAG" ]; then
            echo "package.json ($CURRENT) > última tag ($LATEST_TAG) — prosseguindo"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
          else
            echo "package.json ($CURRENT) <= última tag ($LATEST_TAG) — pulando release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.check.outputs.should_release == 'true'
        run: npm install --ignore-scripts && node build.js

      - name: Instalar zip
        if: steps.check.outputs.should_release == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Zip
        if: steps.check.outputs.should_release == 'true'
        run: zip -r dist.zip dist/

      - name: Changelog
        if: steps.check.outputs.should_release == 'true'
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "## Commits" > CHANGELOG.md
            git log --oneline >> CHANGELOG.md
          else
            echo "## Mudancas desde $LAST_TAG" > CHANGELOG.md
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s" >> CHANGELOG.md
          fi

      - name: Tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          NEW="${{ steps.check.outputs.version }}"
          echo "Criando tag v$NEW"

          git tag "v$NEW"
          git push origin "v$NEW"

      - name: Release
        if: steps.check.outputs.should_release == 'true'
        run: |
          gh release create "v${{ steps.check.outputs.version }}" dist.zip \
            --title "v${{ steps.check.outputs.version }}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}