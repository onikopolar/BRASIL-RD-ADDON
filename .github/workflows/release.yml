name: Release

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm install --ignore-scripts && node build.js

      - name: Instalar zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Zip
        run: zip -r dist.zip dist/

      - name: Changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "## Commits" > CHANGELOG.md
            git log --oneline >> CHANGELOG.md
          else
            echo "## Mudancas desde $LAST_TAG" > CHANGELOG.md
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s" >> CHANGELOG.md
          fi

      - name: Bump e tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Pega a versao atual do package.json
          CURRENT=$(node -p "require('./package.json').version")
          echo "Versao atual no package.json: $CURRENT"

          # Encontra a MAIOR tag existente (nao apenas a do CURRENT)
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -1 | sed 's/^v//')
          echo "Maior tag existente: v${LATEST_TAG:-nenhuma}"

          # Decide a nova versao: max(package.json, latest_tag) + 1 patch
          if [ -n "$LATEST_TAG" ]; then
            # Usa o maior entre CURRENT e LATEST_TAG
            if printf "%s\n%s" "$CURRENT" "$LATEST_TAG" | sort -V | tail -1 | grep -q "$LATEST_TAG"; then
              BASE="$LATEST_TAG"
            else
              BASE="$CURRENT"
            fi
          else
            BASE="$CURRENT"
          fi

          IFS='.' read -r MAJ MIN PAT <<< "$BASE"
          NEW="$MAJ.$MIN.$((PAT + 1))"
          echo "Nova versao: $NEW"

          # Atualiza package.json com a nova versao
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$NEW';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Commit e push da atualizacao do package.json
          git add package.json
          git commit -m "chore: bump version to $NEW [skip ci]" || echo "Sem mudancas no package.json"
          git push origin master

          # Cria a tag
          git tag "v$NEW"
          git push origin "v$NEW"

          echo "VERSION=$NEW" >> $GITHUB_ENV

      - name: Release
        run: |
          gh release create "v$VERSION" dist.zip \
            --title "v$VERSION" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
